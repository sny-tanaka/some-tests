$schema: https://docs.renovatebot.com/renovate-schema.json
extends:
  - config:recommended
  - group:monorepos
timezone: Asia/Tokyo
schedule:
  - before 6am on wednesday
additionalBranchPrefix: ""
prConcurrentLimit: 10
packageRules:
  - matchManagers:
      - npm
    matchPaths:
      - project1/**
      - project2/**
    enabled: true
